<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 100" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="maroonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#800020" />
      <stop offset="100%" stop-color="#a21b3c" />
    </linearGradient>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d2ff" />
      <stop offset="100%" stop-color="#00a3e0" />
    </linearGradient>
    <linearGradient id="mixGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#800020" />
      <stop offset="50%" stop-color="#5100ff" />
      <stop offset="100%" stop-color="#00d2ff" />
    </linearGradient>
    
    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Logo Icon -->
  <g transform="translate(10, 10)">
    <!-- Outer Hexagon Outline -->
    <polygon points="40,0 80,23 80,68 40,90 0,68 0,23" fill="none" stroke="url(#skyGrad)" stroke-width="2.5" opacity="0.3" />
    
    <!-- Left Wing (Maroon) - representing the 'V' left side -->
    <path d="M 20,28 L 40,65 L 40,82 L 12,32 Z" fill="url(#maroonGrad)" />
    
    <!-- Right Wing (Sky Blue) - representing the 'V' right side & growth arrow -->
    <path d="M 60,28 L 40,65 L 40,82 L 68,32 Z" fill="url(#skyGrad)" filter="url(#glow)" opacity="0.9" />
    
    <!-- Center Node (Network & Sourcing) -->
    <circle cx="40" cy="48" r="7" fill="#ffffff" filter="url(#glow)" />
    <!-- Upward Trend Indicator inside the icon -->
    <polyline points="33,48 40,41 47,48" fill="none" stroke="#00d2ff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Logo Text -->
  <!-- "VRaise" in Outfit-like bold font -->
  <text x="110" y="55" font-family="'Outfit', 'Inter', -apple-system, sans-serif" font-size="38" font-weight="800" fill="#ffffff" letter-spacing="-0.5">
    V<tspan fill="url(#skyGrad)">Raise</tspan>
  </text>
  
  <!-- "VENTURES" in clean tracking caps -->
  <text x="112" y="80" font-family="'Inter', -apple-system, sans-serif" font-size="12" font-weight="600" fill="#9ca3af" letter-spacing="6">
    VENTURES
  </text>
</svg>
